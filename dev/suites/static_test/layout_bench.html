<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; font-size: 14px; color: #e6edf3; background: #0d1117; }
  
  /* Layout: full viewport flex row */
  .app { display: flex; flex-direction: row; width: 1280px; height: 800px; }
  
  /* Left activity bar */
  .actbar { 
    display: flex; flex-direction: column;
    width: 48px; background: #21262d; 
    padding: 8px 0;
  }
  .actbar .icon { 
    display: flex; align-items: center; justify-content: center;
    height: 48px; color: #8b949e;
  }
  
  /* Sidebar */
  .sidebar { 
    display: flex; flex-direction: column;
    background: #161b22; border-right: 1px solid #30363d;
    width: 220px;
  }
  .sidebar-header { 
    display: flex; flex-direction: column; padding: 8px 12px;
    font-weight: 600; font-size: 11px; color: #8b949e; text-transform: uppercase;
  }
  .sidebar-item {
    display: flex; flex-direction: row; align-items: center;
    padding: 6px 12px; font-size: 13px; cursor: pointer; height: 37px;
  }
  .sidebar-item.active { background: #1f6feb; color: #fff; }
  
  /* Main editor area */
  .main {
    flex: 1; display: flex; flex-direction: column;
    background: #0d1117;
  }
  .tabs {
    display: flex; flex-direction: row; height: 36px;
    background: #161b22; border-bottom: 1px solid #30363d;
  }
  .tab {
    display: flex; align-items: center;
    padding: 0 16px; font-size: 13px; border-right: 1px solid #30363d;
  }
  .tab.active { background: #0d1117; color: #58a6ff; }
  
  .editor {
    flex: 1; display: flex; flex-direction: column; padding: 16px;
    font-family: monospace; font-size: 13px; line-height: 1.6;
  }
  .line { display: flex; flex-direction: row; }
  .line-num { width: 50px; color: #484f58; text-align: right; padding-right: 16px; }
  .line-text { color: #c9d1d9; }
  .line-text .keyword { color: #ff7b72; }
  .line-text .string { color: #a5d6ff; }
  
  /* Right panel */
  .right-panel {
    display: flex; flex-direction: column;
    width: 200px; background: #161b22; border-left: 1px solid #30363d;
    font-size: 12px;
  }
  .panel-title { 
    padding: 8px 12px; font-weight: 600; font-size: 11px; color: #8b949e; text-transform: uppercase;
  }
  
  /* Status bar */
  .statusbar {
    display: flex; flex-direction: row; align-items: center;
    height: 24px; padding: 0 12px; font-size: 12px;
    background: #161b22; border-top: 1px solid #30363d; color: #8b949e;
    position: fixed; bottom: 0; left: 0; right: 0;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="actbar">
    <div class="icon">A</div>
    <div class="icon">B</div>
    <div class="icon">C</div>
  </div>
  <div class="sidebar">
    <div class="sidebar-header">EXPLORER</div>
    <div class="sidebar-item active">Files</div>
    <div class="sidebar-item">Search</div>
    <div class="sidebar-item">Git</div>
  </div>
  <div class="main">
    <div class="tabs">
      <div class="tab active">main.go</div>
      <div class="tab">config.json</div>
    </div>
    <div class="editor">
      <div class="line"><span class="line-num">1</span><span class="line-text"><span class="keyword">package</span> main</span></div>
      <div class="line"><span class="line-num">2</span><span class="line-text"></span></div>
      <div class="line"><span class="line-num">3</span><span class="line-text"><span class="keyword">import</span> <span class="string">"fmt"</span></span></div>
      <div class="line"><span class="line-num">4</span><span class="line-text"></span></div>
      <div class="line"><span class="line-num">5</span><span class="line-text"><span class="keyword">func</span> main() {</span></div>
      <div class="line"><span class="line-num">6</span><span class="line-text">  fmt.Println(<span class="string">"Hello World"</span>)</span></div>
      <div class="line"><span class="line-num">7</span><span class="line-text">}</span></div>
    </div>
  </div>
  <div class="right-panel">
    <div class="panel-title">OUTLINE</div>
    <div style="padding:4px 12px;color:#d2a8ff;">main()</div>
  </div>
</div>
<div class="statusbar">
  <span>Go 1.26 | LF | UTF-8</span>
</div>
</body>
</html>
