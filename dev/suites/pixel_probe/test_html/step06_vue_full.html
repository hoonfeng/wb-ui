<!DOCTYPE html>
<html class="theme-dark">
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; overflow: hidden; }

/* ── Vue 实际 CSS 变量 ── */
:root, .theme-dark {
  --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
  --text-primary: #e6edf3; --text-secondary: #8b949e; --text-muted: #6e7681;
  --border-color: #30363d; --accent: #58a6ff;
  --activity-bar-bg: #0d1117; --sidebar-bg: #161b22;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-size-base: 13px;
}

body { font-family: var(--font-ui); font-size: var(--font-size-base); color: var(--text-primary); background: var(--bg-primary); }

/* ── Vue 的 CSS Grid 布局 ── */
#app {
  display: grid;
  grid-template-columns: 48px auto 1fr auto;
  grid-template-rows: 30px 1fr 22px;
  background: var(--bg-primary);
}
.titlebar {
  grid-column: 1 / -1; grid-row: 1;
  display: flex; align-items: center; height: 30px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-color);
}
.activity-bar { grid-column: 1; grid-row: 2; background: var(--activity-bar-bg); }
.sidebar { grid-column: 2; grid-row: 2; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); }
.main-area {
  grid-column: 3; grid-row: 2;
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  background: var(--bg-primary);
}
.right-panel { grid-column: 4; grid-row: 2; background: var(--sidebar-bg); }
.statusbar { grid-column: 1 / -1; grid-row: 3; background: var(--bg-tertiary); color: var(--status-text); border-top: 1px solid var(--border-color); }

/* ── 内侧 flex: editor + bottom panel ── */
.editor-area { flex: 1; background: var(--bg-primary); }
.bottom-panel { height: 180px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar"><div class="app-logo" style="width:48px;display:flex;align-items:center;justify-content:center;"><span style="color:var(--accent);font-weight:bold;">P</span></div></div>
  <div class="activity-bar"></div>
  <div class="sidebar"></div>
  <div class="main-area">
    <div class="editor-area"></div>
    <div class="bottom-panel"></div>
  </div>
  <div class="right-panel"></div>
  <div class="statusbar">PairCode IDE</div>
</div>
</body>
</html>
