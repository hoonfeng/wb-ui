<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#131722;color:#e8eaf0;overflow:hidden;user-select:none}
*{box-sizing:border-box}
.prop-row{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:14px;color:#c6d2f0}
.prop-row label{width:64px;flex-shrink:0}
.prop-row .pv{flex:1;min-width:0}
.xseg{display:flex;width:100%;background:#10141f;border:1px solid #2c3b61;border-radius:8px;padding:3px;gap:3px;box-sizing:border-box}
.xseg span{flex:1;text-align:center;padding:5px 0;font-size:14px;cursor:pointer;color:#8fa0c0;background:transparent;border-radius:6px}
.xseg span.on{background:linear-gradient(180deg,#3e6fd6,#2f5cb5);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
</style></head><body>
<div style="width:360px;margin:40px auto">
<div class="prop-row"><label>水平对齐</label><div class="pv"><div class="xseg"><span>左</span><span class="on">中</span><span>右</span></div></div></div>
<div class="prop-row"><label>垂直对齐</label><div class="pv"><div class="xseg"><span>上</span><span class="on">中</span><span>下</span></div></div></div>
</div>
</body></html>
