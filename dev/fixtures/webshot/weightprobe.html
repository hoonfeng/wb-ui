<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>weight probe</title>
<style>
  body { margin: 0; background: #fff; font-family: Arial; font-size: 20px; color: #000; }
  div { padding: 2px 6px; }
  .b1 { font-weight: normal; }
  .b2 { font-weight: bold; }
  .b3 { font-weight: 700; }
  .b4 { font-weight: 600; }
  .b5 { font-weight: 400; }
  .b6 { font-weight: 900; }
  .b7 { font-weight: lighter; }
  .b8 { font-weight: bolder; }
</style>
</head>
<body>
<div class="b1">normal 400 ABC abc 中文字</div>
<div class="b2">bold 关键字 ABC abc 中文字</div>
<div class="b3">700 数值 ABC abc 中文字</div>
<div class="b4">600 数值 ABC abc 中文字</div>
<div class="b5">400 数值 ABC abc 中文字</div>
<div class="b6">900 数值 ABC abc 中文字</div>
<div class="b7">lighter ABC abc 中文字</div>
<div class="b8">bolder ABC abc 中文字</div>
<div><b>b 标签 ABC abc</b> 与 <strong>strong 标签 ABC</strong></div>
<h1>h1 标题 ABC</h1>
<h3>h3 标题 ABC</h3>
</body>
</html>
