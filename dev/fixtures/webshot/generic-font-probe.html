<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>generic font family line-box probe</title>
<style>
  body { margin: 0; padding: 0; }
  div { font-size: 16px; line-height: normal; }
  #plain   { font-family: sans-serif; }
  #plain-u { font-family: ui-sans-serif; }
  #sysui   { font-family: system-ui; }
  #noto    { font-family: "Noto Sans SC"; }
  #arial   { font-family: Arial; }
  #yahei   { font-family: "Microsoft YaHei"; }
  #serif   { font-family: serif; }
  #mono    { font-family: monospace; }
</style>
</head>
<body>
  <div id="plain">Xg</div>
  <div id="plain-u">Xg</div>
  <div id="sysui">Xg</div>
  <div id="noto">Xg</div>
  <div id="arial">Xg</div>
  <div id="yahei">Xg</div>
  <div id="serif">Xg</div>
  <div id="mono">Xg</div>
</body>
</html>
