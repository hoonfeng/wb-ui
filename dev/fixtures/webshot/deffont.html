<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>default font family (D7)</title>
<style>
  /* 不声明 font-family：走引擎的 sans-serif 默认族。
     Windows 浏览器默认 = Arial；修复前引擎用微软雅黑（拉丁字形宽 +19%）。 */
  body { margin: 0; background: #ffffff; font-size: 24px; line-height: 32px; }
  div { height: 32px; }
  #cjk { color: #000000; }
</style>
</head>
<body>
<div id="latin">MMMMMMMMMM IIIIIIIIII</div>
<div id="cjk">默认字体族中文测试</div>
<div id="mix">Arial 中文 mixed 123</div>
</body>
</html>
