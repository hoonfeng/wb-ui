<!doctype html><meta charset="utf-8"><title>input value cjk baseline scan</title>
<style>html,body{margin:0}</style><body>
<div style="font:16px sans-serif">
<div id="d1"><input id="i1" type="text" value="V"></div>
<div id="d2"><input id="i2" type="text" value="Mixed中英"></div>
<div id="d3"><span id="s3">X</span><br><input id="i3" type="text" value="V"></div>
<div id="d4"><input id="i4" type="text" value="V"><br><input id="i5" type="text" value="Mixed中英"></div>
</div>
<pre id="out" style="position:absolute;left:-9999px;top:0;margin:0"></pre>
<script>
var L=[],buf=[];
function emit(s){buf.push(s);if(buf.length===3){L.push(buf.join(' '));buf=[];}}
function flush(){if(buf.length){L.push(buf.join(' '));buf=[];}}
function r3(v){return Math.round(v*1000)/1000;}
['d1','i1','d2','i2','d3','s3','i3','d4','i4','i5'].forEach(function(id){
  var e=document.getElementById(id),r=e.getBoundingClientRect();
  var p=e.parentElement.getBoundingClientRect();
  emit(id+'_h='+r3(r.height));
  emit(id+'_rel='+r3(r.top-p.top));
  emit(id+'_w='+r3(r.width));
});
flush();
document.getElementById('out').textContent=L.join('\n');
</script></body>
</html>
