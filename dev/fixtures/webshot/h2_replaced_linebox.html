<!doctype html><meta charset="utf-8"><title>replaced 元素行盒高是否含 strut descent</title>
<style>html,body{margin:0}</style><body>
<!-- 与 z_replaced_baseline_test.go 的 TestInlineReplacedTallerThanTextStaysInsideLineBox
     同构：13px/1.5 的宿主 + 64×64 的 img。若 Edge 的 wrap 高 = 64 + strut descent，
     则该测试「want 64」的期望值与浏览器行为不符。 -->
<div id="host" style="width:386px;font-family:sans-serif;font-size:13px;line-height:1.5">
  <div id="wrap"><img id="im" style="width:64px;height:64px" alt=""></div>
</div>
<!-- 对照组：16px/normal 宿主 + 30×30 img（h2_baseline_matrix 的 r_img 同构） -->
<div id="host2" style="width:386px;font-family:sans-serif;font-size:16px;line-height:normal">
  <div id="wrap2"><img id="im2" style="width:30px;height:30px" alt=""></div>
</div>
<pre id="out" style="position:absolute;left:-9999px;top:0;margin:0"></pre>
<script>
var ids=['host','wrap','im','host2','wrap2','im2'],L=[];
for(var i=0;i<ids.length;i++){
  var el=document.getElementById(ids[i]),r=el.getBoundingClientRect();
  L.push(ids[i]+' h='+r.height.toFixed(3)+' top='+r.top.toFixed(3)+' hh='+el.getBoundingClientRect().height.toFixed(3));
}
document.getElementById('out').textContent=L.join('\n');
</script></body>
