<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>unit probe</title>
<style>
  body { margin: 0; background: #fff; font-family: Arial; font-size: 20px; color: #000; }
  div { padding: 2px 6px; }
  #e1 { font-size: 2em; }        /* 40px */
  #e2 { font-size: 40px; }       /* 40px */
  #e3 { font-size: 150%; }       /* 30px */
  #e4 { font-size: 2rem; }       /* 40px */
  #e5 { font-size: 1.5em; }      /* 30px */
  #e6 { font-size: 30px; }       /* 30px */
  #e7 { font-size: 2.5em; }      /* 50px */
  #e8 { font-size: 50px; }       /* 50px */
</style>
</head>
<body>
<h1>H1 隐式 2em</h1>
<div id="e1">e1 2em(→40px) MMMM</div>
<div id="e2">e2 40px MMMM</div>
<div id="e3">e3 150%(→30px) MMMM</div>
<div id="e4">e4 2rem(→40px) MMMM</div>
<div id="e5">e5 1.5em(→30px) MMMM</div>
<div id="e6">e6 30px MMMM</div>
<div id="e7">e7 2.5em(→50px) MMMM</div>
<div id="e8">e8 50px MMMM</div>
</body>
</html>
